[package]
name = "tether"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "Native SSH + SFTP workspace: split terminals and a pipelined SFTP engine in one window"
license = "MIT"
readme = "README.md"
repository = "https://github.com/izLoki/Tether"
keywords = ["ssh", "sftp", "terminal", "egui"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
encoding_rs = "0.8"
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["syntect", "svg"] }
egui_dock = { version = "0.21.1", features = ["serde"] }
futures = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
url = "2.5"
rfd = "0.17.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
semver = "1"
sha2 = "0.11"
ssh-key = { version = "=0.7.0-rc.11", features = ["getrandom", "rsa", "ed25519", "encryption"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["full"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vt100 = "0.16.2"
vte = "0.15"
arboard = "3.7"
tempfile = "3"
zeroize = "1"
portable-pty = "0.9"
serde_norway = "0.9.42"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
notify-rust = "4"
toml_edit = "0.25"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray"] }
